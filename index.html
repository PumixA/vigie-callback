<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Vigie · retour de la banque</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: #0b1020; color: #e8ecf8; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 34rem; display: grid; gap: 12px; }
  code { display: block; padding: 10px; border-radius: 8px; background: #172038; word-break: break-all; font-size: 13px; }
  button { justify-self: start; padding: 8px 14px; border: 0; border-radius: 999px; background: #7ba4ff; color: #0b1020; font-weight: 600; cursor: pointer; }
  .mut { color: #a9b3cc; font-size: 14px; }
</style>
</head>
<body>
<main>
  <p id="msg">Retour vers Vigie…</p>
  <div id="manual" hidden>
    <p class="mut">Si Vigie ne s'est pas mise à jour, copie cette adresse et colle-la dans Vigie (Paramètres › Banques).</p>
    <code id="url"></code>
    <button id="copy" type="button">Copier</button>
  </div>
</main>
<script>
  // Relay of the bank login back to Vigie, which listens on this computer only while connecting.
  // The one-time code never leaves the browser: it is passed on to localhost, nowhere else.
  var q = location.search;
  if (/[?&](code|error)=/.test(q)) {
    var target = "http://localhost:8765/callback" + q;
    document.getElementById("url").textContent = target;
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(target).then(function () { document.getElementById("copy").textContent = "Copié"; });
    };
    setTimeout(function () {
      document.getElementById("msg").textContent = "Vigie n'a pas répondu ?";
      document.getElementById("manual").hidden = false;
    }, 2500);
    location.replace(target);
  } else {
    document.getElementById("msg").textContent = "Page de retour de la connexion bancaire de Vigie. Rien à faire ici.";
  }
</script>
</body>
</html>
